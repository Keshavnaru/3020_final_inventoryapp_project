<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .section { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 5px; }
        .form-row { margin: 10px 0; }
        label { display: inline-block; width: 120px; }
        input { padding: 5px; width: 200px; }
        button { 
            padding: 8px 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        button.delete { background: #dc3545; }
        button.delete:hover { background: #c82333; }
        .debug { 
            background: #333; 
            color: #0f0; 
            padding: 10px; 
            margin: 10px 0; 
            font-family: monospace;
            font-size: 12px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Inventory Management - DEBUG MODE</h1>
    
    <div class="section">
        <h3>Test Your API Endpoints First</h3>
        <button onclick="testEndpoints()">Test All API Endpoints</button>
        <div id="apiTest" class="debug"></div>
    </div>
    
    <div class="section">
        <h3>Add New Item</h3>
        <div class="form-row">
            <label>Name:</label>
            <input type="text" id="itemName" value="Test Laptop">
        </div>
        <div class="form-row">
            <label>Description:</label>
            <input type="text" id="itemDescription" value="Test Description">
        </div>
        <div class="form-row">
            <label>Quantity:</label>
            <input type="number" id="itemQty" value="1">
        </div>
        <div class="form-row">
            <label>Price:</label>
            <input type="number" id="itemPrice" value="29.99" step="0.01">
        </div>
        <div class="form-row">
            <label>Location ID:</label>
            <input type="number" id="itemLocation" value="101">
        </div>
        <button onclick="addItem()">Add Item</button>
        <div id="addMessage"></div>
    </div>
    
    <div class="section">
        <h3>Get All Items</h3>
        <button onclick="getAllItems()">Get All Items</button>
        <div id="allItems" class="debug"></div>
    </div>
    
    <div class="section">
        <h3>Debug Console</h3>
        <div id="debugConsole" class="debug"></div>
    </div>

    <script>
        const API_BASE = 'https://0cgmjfb6a2.execute-api.us-east-1.amazonaws.com/dev';
        let debugLog = [];
        
        function logDebug(message) {
            const timestamp = new Date().toLocaleTimeString();
            debugLog.push(`[${timestamp}] ${message}`);
            if (debugLog.length > 20) debugLog.shift();
            
            const debugDiv = document.getElementById('debugConsole');
            debugDiv.innerHTML = debugLog.join('<br>');
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }
        
        // Test all API endpoints
        async function testEndpoints() {
            const testDiv = document.getElementById('apiTest');
            testDiv.innerHTML = 'Testing endpoints...';
            
            const endpoints = [
                { name: 'GET /item', url: `${API_BASE}/item`, method: 'GET' },
                { name: 'GET /items', url: `${API_BASE}/items`, method: 'GET' },
                { name: 'GET /location/101', url: `${API_BASE}/location/101`, method: 'GET' },
                { name: 'POST /item', url: `${API_BASE}/item`, method: 'POST', test: true },
                { name: 'DELETE /item/test', url: `${API_BASE}/item/test`, method: 'DELETE', test: true }
            ];
            
            let results = [];
            
            for (const endpoint of endpoints) {
                try {
                    logDebug(`Testing: ${endpoint.name}`);
                    
                    let response;
                    if (endpoint.test) {
                        // Skip actual POST/DELETE for now
                        results.push(`${endpoint.name}: SKIPPED (test mode)`);
                        continue;
                    }
                    
                    response = await fetch(endpoint.url, { 
                        method: endpoint.method,
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const status = response.status;
                    const statusText = response.statusText;
                    
                    let details = '';
                    if (response.ok) {
                        const data = await response.json();
                        details = ` - OK (${JSON.stringify(data).substring(0, 100)}...)`;
                    }
                    
                    results.push(`${endpoint.name}: ${status} ${statusText}${details}`);
                    logDebug(`${endpoint.name}: ${status} ${statusText}`);
                    
                } catch (error) {
                    results.push(`${endpoint.name}: ERROR - ${error.message}`);
                    logDebug(`${endpoint.name}: ERROR - ${error.message}`);
                }
            }
            
            testDiv.innerHTML = results.join('<br>');
        }
        
        // Add item function
        async function addItem() {
            logDebug('Starting addItem()...');
            
            const itemData = {
                id: `item_${Date.now()}`,
                name: document.getElementById('itemName').value,
                description: document.getElementById('itemDescription').value,
                qty: parseInt(document.getElementById('itemQty').value),
                price: parseFloat(document.getElementById('itemPrice').value),
                location_id: parseInt(document.getElementById('itemLocation').value)
            };
            
            logDebug(`Data to send: ${JSON.stringify(itemData)}`);
            
            try {
                logDebug(`Sending POST to: ${API_BASE}/item`);
                
                const response = await fetch(`${API_BASE}/item`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(itemData)
                });
                
                logDebug(`Response status: ${response.status} ${response.statusText}`);
                
                let result;
                try {
                    result = await response.json();
                    logDebug(`Response data: ${JSON.stringify(result)}`);
                } catch (e) {
                    logDebug(`Failed to parse JSON response: ${e.message}`);
                }
                
                const messageDiv = document.getElementById('addMessage');
                
                if (response.ok) {
                    messageDiv.innerHTML = `<span class="success">✓ Item added successfully!</span>`;
                    messageDiv.className = 'success';
                    logDebug('Item added successfully');
                } else {
                    messageDiv.innerHTML = `<span class="error">✗ Error: ${response.status} ${response.statusText}</span>`;
                    messageDiv.className = 'error';
                    logDebug(`Error: ${response.status} ${response.statusText}`);
                }
                
            } catch (error) {
                logDebug(`Fetch error: ${error.message}`);
                const messageDiv = document.getElementById('addMessage');
                messageDiv.innerHTML = `<span class="error">✗ Network Error: ${error.message}</span>`;
                messageDiv.className = 'error';
            }
        }
        
        // Get all items
        async function getAllItems() {
            logDebug('Getting all items...');
            const itemsDiv = document.getElementById('allItems');
            itemsDiv.innerHTML = 'Loading...';
            
            try {
                // Try /items first, then /item
                let response = await fetch(`${API_BASE}/items`);
                if (!response.ok) {
                    response = await fetch(`${API_BASE}/item`);
                }
                
                logDebug(`Response status: ${response.status}`);
                
                if (response.ok) {
                    const data = await response.json();
                    logDebug(`Got data: ${JSON.stringify(data).substring(0, 200)}...`);
                    
                    // Format the display
                    itemsDiv.innerHTML = JSON.stringify(data, null, 2);
                } else {
                    itemsDiv.innerHTML = `Error: ${response.status} ${response.statusText}`;
                    logDebug(`Error: ${response.status} ${response.statusText}`);
                }
                
            } catch (error) {
                itemsDiv.innerHTML = `Error: ${error.message}`;
                logDebug(`Error: ${error.message}`);
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            logDebug('Page loaded');
            logDebug(`API Base: ${API_BASE}`);
            testEndpoints();
        });
    </script>
</body>
</html>
